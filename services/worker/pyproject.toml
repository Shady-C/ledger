[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ledger-worker"
version = "0.1.0"
description = "Deterministic statement ingestion worker for Ledger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34,<2",
  "camelot-py>=0.11,<2",
  "cryptography>=43,<50",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "polars>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
llm = ["anthropic>=0.34,<1"]

[project.scripts]
ledger-worker = "worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: opt-in integration test requiring LEDGER_TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["worker"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["worker"]
